<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contractor Location Check-in</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; text-align: center; }
    button { font-size: 1.3rem; padding: 16px 32px; background: #0078d4; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #aaa; }
    #status { margin-top: 24px; font-size: 1.1rem; }
    .coords { font-weight: bold; color: #0078d4; }
  </style>
</head>
<body>
  <h1>Location Check-in</h1>
  <p>Press the button once to capture your current location.</p>

  <button id="btn">Get My Location</button>

  <div id="status">Waiting...</div>

  <script>
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        status.textContent = 'Geolocation is not supported by this browser.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Requesting location... (please allow permission)';

      const options = {
        enableHighAccuracy: true,   // use GPS if available
        timeout: 15000,             // 15 seconds max
        maximumAge: 0               // never use cached position
      };

      navigator.geolocation.getCurrentPosition(
        // Success
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);

          status.innerHTML = `
            <p class="coords">Latitude: ${lat}</p>
            <p class="coords">Longitude: ${lon}</p>
            <p>Accuracy: ±${accuracy} metres</p>
            <p><a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=18/${lat}/${lon}" target="_blank">View on map</a></p>
          `;
          btn.disabled = false;
        },
        // Error
        (error) => {
          let msg = 'Error: ';
          switch(error.code) {
            case error.PERMISSION_DENIED:    msg += 'Permission denied by user.'; break;
            case error.POSITION_UNAVAILABLE: msg += 'Location unavailable.'; break;
            case error.TIMEOUT:              msg += 'Request timed out.'; break;
            default:                         msg += 'Unknown error.';
          }
          status.textContent = msg;
          btn.disabled = false;
        },
        options
      );
    });
  </script>
</body>
</html>
