<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor Location Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; font-size: 1.6rem; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      margin-bottom: 14px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #475569;
      margin-bottom: 14px;
    }
    .btn-secondary:hover { background: #64748b; }
    .location-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border-left: 4px solid #3b82f6;
    }
    .location-item strong { display: block; margin-bottom: 4px; }
    .meta { font-size: 0.85rem; color: #94a3b8; }
    .status { margin-top: 12px; font-size: 0.9rem; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .empty { color: #64748b; text-align: center; padding: 20px; }
    .gps-status {
      font-size: 0.85rem;
      margin-bottom: 12px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Contractor Tracker</h1>
  <p class="subtitle">Track contractor locations in real time</p>

  <div class="card">
    <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Add Location</h2>
    <form id="addForm">
      <label>Contractor Name</label>
      <input type="text" id="name" placeholder="e.g. John Chan" required />

      <!-- GPS Button -->
      <button type="button" id="gpsBtn" class="btn-secondary">
        📍 Use My Current Location (GPS)
      </button>
      <div id="gpsStatus" class="gps-status"></div>

      <label>Latitude</label>
      <input type="number" id="lat" step="any" placeholder="22.3193" required />

      <label>Longitude</label>
      <input type="number" id="lng" step="any" placeholder="114.1694" required />

      <label>Notes (optional)</label>
      <input type="text" id="notes" placeholder="At site A..." />

      <button type="submit" id="submitBtn">Save Location</button>
    </form>
    <div id="formStatus" class="status"></div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 1.2rem;">Current Locations</h2>
      <button onclick="loadLocations()" style="width: auto; padding: 8px 14px; font-size: 0.9rem;">
        Refresh
      </button>
    </div>
    <div id="locationsList">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";

    // ========== GPS / Geolocation ==========
    const gpsBtn = document.getElementById("gpsBtn");
    const gpsStatus = document.getElementById("gpsStatus");

    gpsBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        gpsStatus.textContent = "GPS is not supported on this device/browser.";
        gpsStatus.className = "gps-status error";
        return;
      }

      gpsBtn.disabled = true;
      gpsStatus.textContent = "Getting your location... Please allow location access.";
      gpsStatus.className = "gps-status";

      navigator.geolocation.getCurrentPosition(
        // Success
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          document.getElementById("lat").value = lat.toFixed(6);
          document.getElementById("lng").value = lng.toFixed(6);

          gpsStatus.textContent = `Location found: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          gpsStatus.className = "gps-status success";
          gpsBtn.disabled = false;
        },
        // Error
        (error) => {
          let msg = "Could not get location. ";
          switch (error.code) {
            case error.PERMISSION_DENIED:
              msg += "You denied the permission. Please allow location access and try again.";
              break;
            case error.POSITION_UNAVAILABLE:
              msg += "Location information is unavailable.";
              break;
            case error.TIMEOUT:
              msg += "Request timed out. Try again.";
              break;
            default:
              msg += "Unknown error.";
          }
          gpsStatus.textContent = msg;
          gpsStatus.className = "gps-status error";
          gpsBtn.disabled = false;
        },
        // Options
        {
          enableHighAccuracy: true,   // use GPS if available
          timeout: 15000,             // 15 seconds
          maximumAge: 0               // don't use cached position
        }
      );
    });

    // ========== LOAD LOCATIONS ==========
    async function loadLocations() {
      const list = document.getElementById("locationsList");
      list.innerHTML = `<div class="empty">Loading...</div>`;

      try {
        const res = await fetch(`${API_BASE}/locations`);
        if (!res.ok) throw new Error("Failed to fetch");

        const data = await res.json();

        if (!data.length) {
          list.innerHTML = `<div class="empty">No locations yet. Add the first one above.</div>`;
          return;
        }

        list.innerHTML = data.map(loc => `
          <div class="location-item">
            <strong>${escapeHtml(loc.name)}</strong>
            <div class="meta">
              Lat: ${loc.lat} · Lng: ${loc.lng}<br>
              ${loc.notes ? escapeHtml(loc.notes) + "<br>" : ""}
              Updated: ${new Date(loc.updated_at).toLocaleString()}
            </div>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = `<div class="empty error">Error loading data: ${err.message}</div>`;
      }
    }

    // ========== ADD LOCATION ==========
    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("formStatus");

      btn.disabled = true;
      status.textContent = "Saving...";
      status.className = "status";

      const payload = {
        name: document.getElementById("name").value.trim(),
        lat: parseFloat(document.getElementById("lat").value),
        lng: parseFloat(document.getElementById("lng").value),
        notes: document.getElementById("notes").value.trim() || null
      };

      try {
        const res = await fetch(`${API_BASE}/location`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "Failed to save");
        }

        status.textContent = "Saved successfully!";
        status.className = "status success";
        document.getElementById("addForm").reset();
        gpsStatus.textContent = "";
        loadLocations();
      } catch (err) {
        status.textContent = "Error: " + err.message;
        status.className = "status error";
      } finally {
        btn.disabled = false;
      }
    });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadLocations();
  </script>
</body>
</html>
