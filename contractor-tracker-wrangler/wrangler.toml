name = "contractor-tracker"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Static files (index.html lives here)
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database binding
# After you create the database, replace the database_id below
[[d1_databases]]
binding = "DB"
database_name = "contractor-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
